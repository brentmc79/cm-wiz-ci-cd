name: CodeMender Vulnerability Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # Required for Workload Identity Federation (WIF) OIDC

jobs:
  codemender-fix:
    name: Trigger CodeMender Cloud Run Job
    # Only run when a comment mentions @codemender or /codemender on an open issue
    if: |
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (contains(github.event.comment.body, '@codemender') || contains(github.event.comment.body, '/codemender'))
    
    # Client runners are self-hosted in Azure; fallback to [self-hosted, ubuntu-latest]
    runs-on: [self-hosted, linux]

    steps:
      - name: Acknowledge Request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🚀 **Google CodeMender**: Triggered fix workflow in Cloud Run. Analyzing the Wiz security finding and generating patch...'
            });

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || 'att-wiz-cm-ci-cd' }}

      - name: Execute CodeMender Cloud Run Job
        id: run-job
        run: |
          JOB_NAME="${{ vars.GCP_CLOUD_RUN_JOB_NAME || 'codemender-fix-runner' }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          PROJECT="${{ vars.GCP_PROJECT_ID || 'att-wiz-cm-ci-cd' }}"

          echo "Initiating Cloud Run Job: ${JOB_NAME} in region ${REGION} (Project: ${PROJECT})"

          # Trigger the Cloud Run Job with issue metadata overrides
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --wait \
            --update-env-vars="REPO_FULL_NAME=${{ github.repository }},ISSUE_NUMBER=${{ github.event.issue.number }},TARGET_BRANCH=${{ github.event.repository.default_branch }}"

      - name: Report Failure on Error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Google CodeMender**: Failed to execute fix job in Cloud Run. Please check GitHub Action execution logs.'
            });
